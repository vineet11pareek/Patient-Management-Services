spring.application.name=analytic-service
server.port=4002

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

#logging.level.org.springframework.kafka= debug
#logging.level.org.apache.kafka=debug
#
#spring.kafka.properties.auto.offset.reset= earliest


# ===============================
# Actuator / Health
# ===============================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.kafka.enabled=true

# Enable Kubernetes-style probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true


# ===============================
# Tracing (OpenTelemetry + Zipkin)
# ===============================
management.tracing.sampling.probability=1.0
management.opentelemetry.logging.export.otlp.endpoint=http://otel-collector:4318/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.otlp.metrics.export.enabled=false

# Enable Kafka observation
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true